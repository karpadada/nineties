[project]
name = "nineties-music-browser"
version = "0.8.1"
description = "A local YouTube Music browser and Spotify-to-MP3 playlist sync tool"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "flask>=3.1,<4",
  "yt-dlp>=2026.8.19",
  "yt-dlp-ejs",
  "ytmusicapi>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
